<!doctype html>
<html lang="{{LanguageCode}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{Subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#f3f4f6;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(15,23,42,0.08);">
          <tr>
            <td align="center" style="padding:28px 32px;border-bottom:1px solid #e5e7eb;background-color:#111827;">
              <span style="font-family:Arial,'Helvetica Neue',sans-serif;font-size:22px;font-weight:700;line-height:1.2;letter-spacing:3px;color:#ffffff;">VOID BOT</span>
            </td>
          </tr>
          <tr>
            <td style="padding:40px 40px 32px;font-family:Arial,'Helvetica Neue',sans-serif;">
              <h1 style="margin:0 0 24px;font-size:22px;font-weight:700;line-height:1.4;color:#111827;">{{Subject}}</h1>
              <div style="font-size:16px;line-height:1.75;color:#374151;white-space:pre-line;word-break:break-word;">{{Content}}</div>
              <p style="margin:32px 0 0;font-size:15px;line-height:1.6;color:#374151;">{{TeamSignature}}</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:22px 32px;border-top:1px solid #e5e7eb;background-color:#f9fafb;font-family:Arial,'Helvetica Neue',sans-serif;font-size:12px;line-height:1.6;color:#6b7280;">
              {{AutomatedNotice}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
